<script>
(function(){
  function fmt(ts){
    if(!ts) return "—";
    var d = new Date(ts);
    var now = new Date();
    var diff = Math.floor((now - d) / 1000);
    if(diff < 5) return "Just now";
    if(diff < 60) return diff + "s ago";
    if(diff < 3600) return Math.floor(diff/60) + " min ago";
    if(diff < 86400) return Math.floor(diff/3600) + "h ago";
    return d.toLocaleString();
  }
  function tick(){
    var nodes = document.querySelectorAll(".coop-last-synced, #coop-last-synced");
    if(!nodes || !nodes.length) return;
    var ts = window.__coopCloudLastSyncedAt || 0;
    var online = window.__coopCloudReady && window.COOP_CLOUD && window.COOP_CLOUD.enabled;
    var text, colorCls;
    if(!online){
      text = "Online sync: Off";
      colorCls = "text-red-600";
    } else if(!ts){
      text = "Last synced: Waiting…";
      colorCls = "text-red-600";
    } else {
      var diff = Math.floor((Date.now() - ts) / 1000);
      if(diff < 8){
        text = "● Live • Synced " + fmt(ts);
        colorCls = "text-red-600";
      } else {
        text = "Last synced: " + fmt(ts);
        colorCls = "text-emerald-700";
      }
    }
    for(var i=0;i<nodes.length;i++){
      var el = nodes[i];
      el.textContent = text;
      el.className = "coop-last-synced text-[11px] mt-1.5 font-medium " + colorCls;
    }
  }
  setInterval(tick, 1000);
  // also run soon after load
  setTimeout(tick, 500);
  setTimeout(tick, 2000);
})();
</script>

<script>
window.__showNoticeDetail = function(a){
  if(!a) return;
  var modal = document.getElementById("notice-detail-modal");
  if(!modal) return;
  var typeLabel = a.type === "member_message" ? "From member (private)"
    : a.type === "admin_dm" ? "Private message"
    : a.type === "meeting" ? "Meeting"
    : a.type === "notice" ? "Notice"
    : (a.type || "Message");
  document.getElementById("ndm-type").textContent = typeLabel;
  document.getElementById("ndm-title").textContent = a.title || "Message";
  var meta = [];
  if(a.date) meta.push(a.date);
  if(a.time) meta.push(a.time);
  if(a.location) meta.push(a.location);
  if(a.toName) meta.push("To: " + a.toName);
  if(a.fromName) meta.push("From: " + a.fromName);
  document.getElementById("ndm-meta").textContent = meta.join(" • ");
  document.getElementById("ndm-body").textContent = a.description || "(No message text)";
  modal.style.display = "flex";
};
(function(){
  var modal = document.getElementById("notice-detail-modal");
  if(!modal) return;
  var close = function(){ modal.style.display = "none"; };
  var btn = document.getElementById("ndm-close");
  if(btn) btn.onclick = close;
  modal.addEventListener("click", function(e){ if(e.target === modal) close(); });
})();
</script>


<script>
window.__coopBuildSavingsFlash = function(list){
  try {
    var arr = Array.isArray(list) ? list.slice() : [];
    arr = arr.filter(function(c){
      if(!c || c.amount == null) return false;
      var typ = String(c.type || "savings").toLowerCase();
      return typ === "savings" || typ === "contribution" || typ === "contrib";
    });
    arr.sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });
    if(!arr.length){
      return "Update: the last update on members savings is not available yet.";
    }
    var last = arr[0];
    var d = last.date || "";
    var t = last.time || "";
    if(!t && last.createdAt){
      try { t = new Date(last.createdAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); } catch(e){}
    }
    if(!t && last.updatedAt){
      try { t = new Date(last.updatedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); } catch(e){}
    }
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var dWord = d;
    try {
      var parts = String(d).split(/[-/T]/);
      if(parts.length >= 3){
        var y = parts[0], m = parseInt(parts[1],10), day = parseInt(parts[2],10);
        if(m >= 1 && m <= 12 && day) dWord = day + " " + months[m-1] + " " + y;
      } else {
        var dt = new Date(d);
        if(!isNaN(dt.getTime())) dWord = dt.getDate() + " " + months[dt.getMonth()] + " " + dt.getFullYear();
      }
    } catch(e2){}
    var when = dWord ? (t ? (dWord + " " + t) : dWord) : (t || "recently");
    return "Update: the last update on members savings is on " + when + ".";
  } catch(err) {
    return "Update: the last update on members savings is not available yet.";
  }
};
</script>


<script>
window.__coopGetAdminKey = function(){
  try {
    var keysToTry = ["coop_session_v1","coop_auth_v2","coop_auth","coop_auth_v1"];
    for(var k=0;k<keysToTry.length;k++){
      var raw = null;
      try { raw = sessionStorage.getItem(keysToTry[k]); } catch(e){}
      if(!raw){ try { raw = localStorage.getItem(keysToTry[k]); } catch(e2){} }
      if(raw){
        try {
          var obj = JSON.parse(raw);
          if(obj && (obj.adminId || obj.userId || obj.username)){
            var id = obj.adminId || obj.userId || obj.username;
            if(id) return "coop_seen_notices_admin_v1_" + String(id).replace(/[^a-zA-Z0-9_-]/g,"_");
          }
        } catch(e3){}
      }
    }
  } catch(e){}
  return "coop_seen_notices_admin_v1_default";
};
window.__coopGetUnreadNotices = function(isAdmin, memberId, meetings) {
  try {
    var list = Array.isArray(meetings) ? meetings : [];
    var key = isAdmin ? window.__coopGetAdminKey() : ("coop_seen_notices_member_v1_" + (memberId || "x"));
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { seen = {}; }
    return list.filter(function(a) {
      if (!a || !a.id || seen[a.id]) return false;
      if (isAdmin) {
        if (a.deletedByAdmin && (a.type === "member_message" || a.type === "admin_dm")) return false;
        return true;
      }
      if (a.type === "member_message") return false;
      if (a.type === "admin_dm") {
        if (a.toMemberId !== memberId) return false;
        if (a.deletedByMember) return false;
        if (a.deletedByMembers && a.deletedByMembers.indexOf(memberId) >= 0) return false;
        return true;
      }
      return a.type === "meeting" || a.type === "notice" || !a.type;
    });
  } catch (err) { return []; }
};
window.__coopMarkNoticesSeen = function(isAdmin, memberId, meetings) {
  try {
    var list = Array.isArray(meetings) ? meetings : [];
    var key = isAdmin ? window.__coopGetAdminKey() : ("coop_seen_notices_member_v1_" + (memberId || "x"));
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { seen = {}; }
    list.forEach(function(a) {
      if (!a || !a.id) return;
      if (isAdmin) { seen[a.id] = 1; return; }
      if (a.type === "member_message") return;
      if (a.type === "admin_dm" && a.toMemberId !== memberId) return;
      if (a.type === "admin_dm" || a.type === "meeting" || a.type === "notice" || !a.type) seen[a.id] = 1;
    });
    localStorage.setItem(key, JSON.stringify(seen));
  } catch (err) {}
};
</script>



<script>
(function(){
  // Keep sync ON
  try{
    var cc=localStorage.getItem('coop_cloud_config_v1');
    if(cc){
      var p=JSON.parse(cc);
      if(p && p.enabled===false){ p.enabled=true; localStorage.setItem('coop_cloud_config_v1', JSON.stringify(p)); }
    }
    if(window.COOP_CLOUD) window.COOP_CLOUD.enabled=true;
  }catch(e){}

  function showToast(m){
    var t=document.createElement('div');
    t.textContent=m;
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:9px 16px;border-radius:999px;font-size:12px;z-index:2147483647;font-weight:600;';
    document.body.appendChild(t);
    setTimeout(function(){ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(function(){t.remove();},300); },2000);
  }
  function doRefresh(btn){
    try{
      if(btn){ btn.classList.add('coop-spin'); btn.disabled=true; }
      var finish=function(ok){
        if(btn){ btn.classList.remove('coop-spin'); btn.disabled=false; }
        showToast(ok?'Live synced ✓':'Refresh done');
      };
      var p=null;
      try{ if(typeof window.__coopCloudLoad==='function') p=window.__coopCloudLoad(); }catch(e){}
      if(p && p.then){
        p.then(function(d){ try{ if(d) window.dispatchEvent(new CustomEvent('coop-cloud-data',{detail:d})); }catch(e){} finish(true); }).catch(function(){ finish(false); });
        setTimeout(function(){ finish(true); },3500);
      }else{
        try{ window.dispatchEvent(new CustomEvent('coop-manual-refresh',{detail:{ts:Date.now()}})); }catch(e){}
        setTimeout(function(){ finish(true); }, 600);
      }
    }catch(e){}
  }

  function addTopRefresh(){
    // Find the top header action area (has AK avatar and download/upload icons)
    // Look for button with AK or header with 68px height
    var headers=document.querySelectorAll('header, div');
    var target=null;
    // Find element that contains AK and has download icons
    document.querySelectorAll('button, div').forEach(function(el){
      // Header with AK text and download icon nearby
      if(el.textContent && el.textContent.trim()==='AK' && el.tagName==='DIV'){
        // Its parent is action area
        var parent=el.parentElement;
        if(parent){
          // Look for sibling buttons with download/upload
          if(parent.querySelectorAll('button').length>=2){
            target=parent;
          }
        }
      }
    });
    // Fallback: find the top bar with h-[68px]
    if(!target){
      document.querySelectorAll('[class*="h-\[68px\]"]').forEach(function(el){ target=el; });
    }

    if(!target) return false;

    // Check if we already added
    if(target.querySelector('#coop-top-refresh-btn')) return true;

    // Find the download button to insert before it
    var downloadBtn=null;
    target.querySelectorAll('button').forEach(function(b){
      // download icon button usually has svg
      if(!downloadBtn) downloadBtn=b;
    });

    var btn=document.createElement('button');
    btn.id='coop-top-refresh-btn';
    btn.type='button';
    btn.title='Refresh page - stay on same page';
    btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.7 1 6.3 2.7"/><path d="M21 3v6h-6"/></svg>';
    btn.style.cssText='width:38px;height:38px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;color:#0f172a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;';
    btn.onclick=function(e){ e.preventDefault(); doRefresh(this); };

    // Insert as first button in action area
    if(target.firstChild){
      target.insertBefore(btn, target.firstChild);
    } else {
      target.appendChild(btn);
    }
    return true;
  }

  var style=document.createElement('style');
  style.textContent='@keyframes coop-spin{to{transform:rotate(360deg)}} .coop-spin svg{animation:coop-spin .7s linear infinite} #coop-top-refresh-btn:active{transform:scale(.92)} #coop-top-refresh-btn:hover{background:#f1f5f9!important} /* hide old junk icons */ .coop-one-refresh, .coop-refresh-live-btn, .coop-inline-refresh, #coop-fixed-refresh, #coop-perm-refresh, #coop-always-refresh-wrap { display:none !important; }';
  document.head.appendChild(style);

  addTopRefresh();
  var tries=0;
  var iv=setInterval(function(){ if(addTopRefresh() || tries++>100) { if(tries>100) clearInterval(iv); } }, 500);
  document.addEventListener('DOMContentLoaded', addTopRefresh);
  window.addEventListener('load', addTopRefresh);
  var obs=new MutationObserver(function(){ addTopRefresh(); });
  obs.observe(document.body, {childList:true, subtree:true});
})();
</script>

</body>
</html>
